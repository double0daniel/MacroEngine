name: MacroEngine
options:
  bundleIdPrefix: com.double0daniel
  projectFormat: xcode15_0
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: en-GB

targets:
  MacroEngine:
    type: application
    platform: iOS
    sources:
      - path: Assets.xcassets
        buildPhase: resources
      - WidgetDataManager.swift
      - NotificationManager.swift
      - HealthKitManager.swift
      - MascotAvatarView.swift
      - Theme.swift
      - Models.swift
      - Components.swift
      - TrackerViews.swift
      - SettingsView.swift
      - DashboardView.swift
      - LocalAIEngine.swift
      - FoodSearchView.swift
      - FoodLibraryViews.swift
      - RecipeImporterService.swift
      - RecipeImportPreviewView.swift
      - OnboardingView.swift
      - MacroEngineApp.swift
      - OpenFoodFactsService.swift
      - BarcodeScannerView.swift
      - AppIconArtwork.swift
      - WidgetData.swift
    dependencies:
      - target: MacroEngineWidgetExtension
        embed: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.double0daniel.MacroEngine
        PRODUCT_NAME: MacroEngine
        SWIFT_VERSION: "5.0"
        IPHONEOS_DEPLOYMENT_TARGET: "17.0"
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: "YES"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_NSCameraUsageDescription: "MacroEngine uses the camera to scan food barcodes."
        INFOPLIST_KEY_NSHealthShareUsageDescription: "MacroEngine reads active energy and body weight to update your daily calorie allowance and weight history."
        INFOPLIST_KEY_NSHealthUpdateUsageDescription: "MacroEngine saves logged water intake to Apple Health."
        INFOPLIST_KEY_UILaunchScreen_Generation: "YES"
        CODE_SIGN_ENTITLEMENTS: MacroEngine.entitlements
    scheme:
      testTargets:
        - MacroEngineTests

  MacroEngineWidgetExtension:
    type: app-extension
    platform: iOS
    sources:
      - WidgetExtension.swift
      - WidgetData.swift
      - WidgetDataManager.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.double0daniel.MacroEngine.WidgetExtension
        PRODUCT_NAME: MacroEngineWidgetExtension
        SWIFT_VERSION: "5.0"
        IPHONEOS_DEPLOYMENT_TARGET: "17.0"
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: "NO"
        APPLICATION_EXTENSION_API_ONLY: "YES"
        SKIP_INSTALL: "YES"
        CODE_SIGN_ENTITLEMENTS: MacroEngineWidgetExtension.entitlements
    info:
      path: MacroEngineWidgetExtension-Info.plist
      properties:
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension

  MacroEngineTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - Tests
    dependencies:
      - target: MacroEngine
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.double0daniel.MacroEngineTests
        SWIFT_VERSION: "5.0"
        IPHONEOS_DEPLOYMENT_TARGET: "17.0"
        GENERATE_INFOPLIST_FILE: "YES"
