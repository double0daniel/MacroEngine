name: Build iOS IPA

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build unsigned iPhone app
        run: |
          set -euo pipefail
          xcodebuild \
            -project MacroEngine.xcodeproj \
            -scheme MacroEngine \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Package unsigned IPA
        run: |
          set -euo pipefail
          APP_PATH="$RUNNER_TEMP/DerivedData/Build/Products/Release-iphoneos/MacroEngine.app"
          PAYLOAD_PATH="$RUNNER_TEMP/ipa/Payload"
          test -d "$APP_PATH"
          mkdir -p "$PAYLOAD_PATH"
          cp -R "$APP_PATH" "$PAYLOAD_PATH/MacroEngine.app"
          ditto -c -k --sequesterRsrc --keepParent "$PAYLOAD_PATH" "$RUNNER_TEMP/MacroEngine-unsigned.ipa"

      - name: Upload unsigned IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: MacroEngine-unsigned-IPA
          path: ${{ runner.temp }}/MacroEngine-unsigned.ipa
          if-no-files-found: error
