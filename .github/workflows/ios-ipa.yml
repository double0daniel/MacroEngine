name: Build iOS IPA

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build unsigned iPhone app
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          set -euo pipefail
          if [[ -z "$OPENAI_API_KEY" ]]; then
            echo "::error::The OPENAI_API_KEY repository secret is empty or unavailable."
            exit 1
          fi
          xcodebuild \
            -project MacroEngine.xcodeproj \
            -scheme MacroEngine \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            OPENAI_API_KEY="$OPENAI_API_KEY" \
            INFOPLIST_KEY_OPENAI_API_KEY="$OPENAI_API_KEY" \
            CODE_SIGNING_ALLOWED=NO \
            build

          APP_PLIST="$RUNNER_TEMP/DerivedData/Build/Products/Release-iphoneos/MacroEngine.app/Info.plist"
          if /usr/libexec/PlistBuddy -c 'Print :OPENAI_API_KEY' "$APP_PLIST" >/dev/null 2>&1; then
            /usr/libexec/PlistBuddy -c "Set :OPENAI_API_KEY $OPENAI_API_KEY" "$APP_PLIST"
          else
            /usr/libexec/PlistBuddy -c "Add :OPENAI_API_KEY string $OPENAI_API_KEY" "$APP_PLIST"
          fi
          PLIST_API_KEY=$(/usr/libexec/PlistBuddy -c 'Print :OPENAI_API_KEY' "$APP_PLIST")
          if [[ "$PLIST_API_KEY" != "$OPENAI_API_KEY" ]]; then
            echo "::error::OPENAI_API_KEY was not embedded correctly in the app Info.plist."
            exit 1
          fi

      - name: Package unsigned IPA
        run: |
          set -euo pipefail
          APP_PATH="$RUNNER_TEMP/DerivedData/Build/Products/Release-iphoneos/MacroEngine.app"
          OUTPUT_PATH="$RUNNER_TEMP/output"
          PAYLOAD_PATH="$OUTPUT_PATH/Payload"
          IPA_PATH="$OUTPUT_PATH/MacroEngine-unsigned.ipa"
          test -d "$APP_PATH"
          mkdir -p "$PAYLOAD_PATH"
          cp -R "$APP_PATH" "$PAYLOAD_PATH/MacroEngine.app"
          ditto -c -k --sequesterRsrc --keepParent "$PAYLOAD_PATH" "$IPA_PATH"
          test -f "$IPA_PATH"

      - name: Upload unsigned IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: MacroEngine-unsigned-IPA
          path: ${{ runner.temp }}/output/MacroEngine-unsigned.ipa
          if-no-files-found: error

      - name: Publish raw IPA to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          IPA_PATH="$RUNNER_TEMP/output/MacroEngine-unsigned.ipa"
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "$IPA_PATH" --clobber
          else
            gh release create "$GITHUB_REF_NAME" "$IPA_PATH" \
              --title "MacroEngine $GITHUB_REF_NAME" \
              --generate-notes
          fi
